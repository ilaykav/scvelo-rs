[build-system]
requires = ["maturin>=1.7"]
build-backend = "maturin"

[project]
name = "scvelo-rs"
version = "0.1.1"
description = "Drop-in Rust acceleration of scVelo for single-cell RNA velocity."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Ilay Kavitzky", email = "ilay.kavitzky@gmail.com" }]
keywords = [
    "scvelo",
    "rna-velocity",
    "single-cell",
    "single-cell-rna-seq",
    "bioinformatics",
    "rust",
    "pyo3",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "anndata>=0.10",
]

[project.urls]
Homepage   = "https://github.com/ilaykav/scvelo-rs"
Repository = "https://github.com/ilaykav/scvelo-rs"
Issues     = "https://github.com/ilaykav/scvelo-rs/issues"
Changelog  = "https://github.com/ilaykav/scvelo-rs/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "scvelo>=0.3",
    "scanpy>=1.10",
    "pytest-benchmark>=4",
]
docs = [
    "sphinx>=7",
    "furo>=2024",
    "myst-parser>=2",
    "sphinx-autodoc-typehints>=2",
]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "scvelo_rs._scvelo_rs"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "benchmark: long-running speedup benchmarks (opt in: pytest -m benchmark)",
]
# Skip benchmarks by default — they take 60+ minutes.
addopts = "-m 'not benchmark'"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "docs/_build",
    "docs/_archive",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — handled by formatter
    "E741",  # ambiguous variable names (we use `o`, `t_` to mirror scvelo)
    "B008",  # function calls in defaults (allowed for AnnData ops)
]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally import after pytest.importorskip / sys.path setup.
"tests/**" = ["E402"]
# Notebooks bind intermediate variables for inspection.
"notebooks/**" = ["F841", "E402"]
